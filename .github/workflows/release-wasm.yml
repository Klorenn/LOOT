# Reproducible, publicly verifiable wasm builds for the Soroban contracts.
# Uses the official StellarExpert reusable workflow, which builds with a pinned stellar-cli,
# embeds source_repo metadata, publishes a GitHub release with the wasm, and creates a build
# provenance attestation so stellar.expert can mark the deployed contract as "verified source".
# Steps and the post-ceremony order: docs/REPRODUCIBLE-BUILD.md
name: Release wasm

on:
  push:
    tags:
      - "contracts-v*"
  workflow_dispatch:
    inputs:
      release_name:
        description: "Unique release name (use the same value you would use as tag, e.g. contracts-v0.2.0-rc1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  registry:
    name: Registry (chestzk-chest)
    permissions:
      id-token: write
      contents: write
      attestations: write
    # Pinned to the commit of tag v28.1.0 (stellar-cli 28.1.0). Do not use @main.
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@6b16426dd3a61715ddddf83a2df322a6371fe071 # v28.1.0
    with:
      release_name: ${{ github.event.inputs.release_name || github.ref_name }}
      release_description: "LOOT registry contract (contracts/chest)"
      relative_path: contracts/chest
      package: chestzk-chest
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}

  verifier:
    name: Verifier (chestzk-verifier)
    permissions:
      id-token: write
      contents: write
      attestations: write
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@6b16426dd3a61715ddddf83a2df322a6371fe071 # v28.1.0
    with:
      release_name: ${{ github.event.inputs.release_name || github.ref_name }}
      release_description: "LOOT Groth16 verifier (contracts/verifier-mainnet), vk from the multiparty ceremony"
      relative_path: contracts/verifier-mainnet
      package: chestzk-verifier
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}
