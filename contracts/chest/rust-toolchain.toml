# Pinned so wasm builds are reproducible. Keep in sync with docs/REPRODUCIBLE-BUILD.md.
# soroban-sdk 27.x needs rustc >= 1.91, and stellar-cli refuses exactly 1.91.0, so 1.92.0; wasm32v1-none is the target
# `stellar contract build` uses.
[toolchain]
channel = "1.92.0"
profile = "minimal"
targets = ["wasm32v1-none"]
